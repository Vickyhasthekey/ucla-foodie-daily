# Free ping so Neon + the Vercel function stay warm between visits.
# GitHub schedule can drift a few minutes; still far cheaper than a paid always-on DB.
name: Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --max-time 45 "https://ucla-foodie-daily.vercel.app/health"
