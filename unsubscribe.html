<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe · UCLA Foodie Daily</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html">UCLA FOODIE DAILY</a>
      <a href="signup.html">Sign up</a>
    </nav>
    <div class="card" style="text-align:center;padding:48px 24px">
      <h1>🍽️ You've been unsubscribed</h1>
      <p id="who" class="lede">This address will no longer receive UCLA Foodie Daily.</p>
      <p>Changed your mind? <a href="signup.html">Re-subscribe here</a></p>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const email = params.get("email");
    if (email) {
      const key = "foodie-daily-local";
      const kept = JSON.parse(localStorage.getItem(key) || "[]").filter(function (item) {
        return item.email.toLowerCase() !== email.toLowerCase();
      });
      localStorage.setItem(key, JSON.stringify(kept));
      document.getElementById("who").textContent = email + " will no longer receive UCLA Foodie Daily.";
    }
  </script>
</body>
</html>
