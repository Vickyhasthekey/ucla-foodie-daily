<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hungry Foodie bear">
  <!-- Soft cream badge -->
  <circle cx="32" cy="32" r="30" fill="#FFF4D6"/>
  <!-- Ears -->
  <circle cx="14" cy="16" r="9" fill="#8B5A2B"/>
  <circle cx="50" cy="16" r="9" fill="#8B5A2B"/>
  <circle cx="14" cy="16" r="5" fill="#E8A87C"/>
  <circle cx="50" cy="16" r="5" fill="#E8A87C"/>
  <!-- Head -->
  <circle cx="32" cy="34" r="22" fill="#A66B2F"/>
  <!-- Muzzle -->
  <ellipse cx="32" cy="40" rx="12" ry="9" fill="#F3D5B5"/>
  <!-- Hungry open mouth -->
  <ellipse cx="32" cy="44" rx="5.5" ry="4" fill="#5C2E1A"/>
  <ellipse cx="32" cy="42.5" rx="4" ry="1.6" fill="#E07A5F"/>
  <!-- Tiny drool (hungry cue) -->
  <path d="M36.5 46.5c0 2.2 1.4 3.6 1.4 3.6s1.4-1.4 1.4-3.6-1.4-2-1.4-2-1.4.7-1.4 2z" fill="#7EC8E3"/>
  <!-- Nose -->
  <ellipse cx="32" cy="36.5" rx="3.2" ry="2.4" fill="#3A2214"/>
  <circle cx="31" cy="35.8" r="0.7" fill="#F5E6D3" opacity=".7"/>
  <!-- Eyes (hopeful / hungry) -->
  <circle cx="23.5" cy="30" r="3.2" fill="#2A1A10"/>
  <circle cx="40.5" cy="30" r="3.2" fill="#2A1A10"/>
  <circle cx="24.4" cy="29" r="1.1" fill="#FFF"/>
  <circle cx="41.4" cy="29" r="1.1" fill="#FFF"/>
  <!-- Blush -->
  <ellipse cx="18.5" cy="36" rx="3.2" ry="1.8" fill="#E8A87C" opacity=".85"/>
  <ellipse cx="45.5" cy="36" rx="3.2" ry="1.8" fill="#E8A87C" opacity=".85"/>
  <!-- Gold crumb accent (UCLA gold hint) -->
  <circle cx="44" cy="48" r="2.2" fill="#FFD100"/>
</svg>
