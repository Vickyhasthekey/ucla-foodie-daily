<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bear face with fish">
  <circle cx="32" cy="32" r="30" fill="#FFF4D6"/>
  <!-- Ears -->
  <circle cx="14" cy="16" r="9" fill="#A66B2F"/>
  <circle cx="50" cy="16" r="9" fill="#A66B2F"/>
  <circle cx="14" cy="16" r="5" fill="#E8A87C"/>
  <circle cx="50" cy="16" r="5" fill="#E8A87C"/>
  <!-- Head -->
  <circle cx="32" cy="34" r="22" fill="#A66B2F"/>
  <!-- Muzzle -->
  <ellipse cx="32" cy="40" rx="11" ry="8" fill="#F3D5B5"/>
  <!-- Eyes -->
  <circle cx="23.5" cy="29" r="3.2" fill="#2A1A10"/>
  <circle cx="40.5" cy="29" r="3.2" fill="#2A1A10"/>
  <circle cx="24.4" cy="28" r="1.1" fill="#FFF"/>
  <circle cx="41.4" cy="28" r="1.1" fill="#FFF"/>
  <!-- Nose -->
  <ellipse cx="32" cy="36.5" rx="3" ry="2.2" fill="#3A2214"/>
  <!-- Blush -->
  <ellipse cx="18.5" cy="36" rx="3" ry="1.7" fill="#E8A87C" opacity=".9"/>
  <ellipse cx="45.5" cy="36" rx="3" ry="1.7" fill="#E8A87C" opacity=".9"/>
  <!-- Horizontal gold fish in front of face -->
  <ellipse cx="32" cy="48" rx="18" ry="6.5" fill="#FFD100"/>
  <ellipse cx="32" cy="48" rx="14" ry="4.2" fill="#FFE566" opacity=".55"/>
  <!-- Fish eye -->
  <circle cx="46" cy="47" r="1.6" fill="#1E5A8A"/>
  <circle cx="46.5" cy="46.5" r="0.55" fill="#FFF"/>
  <!-- Tail (left) -->
  <path d="M14 48 L6 42 L8 48 L6 54 Z" fill="#FFD100"/>
  <!-- Fin -->
  <path d="M28 42 Q32 38 36 42" fill="none" stroke="#E6B800" stroke-width="1.5" stroke-linecap="round"/>
</svg>
