<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UCLA Foodie Daily{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a class="brand" href="/">UCLA FOODIE DAILY</a>
      {% if account %}<a href="/account">{{ account.email }}</a>{% else %}<a href="/account">Account</a>{% endif %}
    </nav>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
