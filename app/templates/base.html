<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UCLA Foodie Daily{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v=bear-sil-1" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico?v=bear-sil-1" sizes="any">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=bear-sil-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@450;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css?v=ucla-live-1">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a class="brand" href="/">UCLA Foodie Daily</a>
      {% if account %}<a href="/account">{{ account.email }}</a>{% else %}<a href="/account">Account</a>{% endif %}
    </nav>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
