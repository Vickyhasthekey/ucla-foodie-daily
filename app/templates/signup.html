{% extends "base.html" %}
{% block title %}Sign up · UCLA Foodie Daily{% endblock %}
{% block body %}
<h1>What do you feel like eating?</h1>
<p class="lede">Type it however you would say it. We'll find your matching dining hall today.</p>
{% if error %}<p class="warn">{{ error }}</p>{% endif %}
<form class="card" method="post" action="/signup">
  <label>Email
    <input name="email" type="email" required placeholder="you@g.ucla.edu" value="{{ email }}">
  </label>
  <label>What do you want?
    <textarea name="wish" rows="3" required placeholder="a warm bowl with beef, or something light">{{ wish }}</textarea>
  </label>
  <button type="submit">See today's hall</button>
</form>
{% endblock %}
