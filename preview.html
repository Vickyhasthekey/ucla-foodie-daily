<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample email · UCLA Foodie Daily</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html">UCLA FOODIE DAILY</a>
      <a href="signup.html">Sign up</a>
    </nav>
    <h1>Sample morning email</h1>
    <p class="lede" id="subject"></p>
    <div class="card mail" id="mail"></div>
    <p class="note">Built with the same wording rules as the n8n email step, using a made-up menu. Closed days are rendered here and are not sent.</p>
  </main>
  <script src="src/email.js"></script>
  <script>
    const message = renderEmail({
      today: "Friday, October 9",
      email: "you@g.ucla.edu",
      menuText: SAMPLE_MENU,
      parsed: SAMPLE_PARSED,
      signupUrl: "signup.html",
      unsubscribeUrl: "unsubscribe.html?email=you@g.ucla.edu",
    });
    document.getElementById("subject").textContent = message.subject;
    document.getElementById("mail").innerHTML = message.html;
  </script>
</body>
</html>
